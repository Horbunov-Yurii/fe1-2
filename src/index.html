<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css" integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <button type="button" class="open_modal">Відкрити</button>
        <div class="bakdrop">
            <div class="modal">
                <form class="modal_form">
                    <label class="modal_label">Введіть назву морозива
                        <input type="text" name="title" class="modal_inp">
                    </label>
                    <label class="modal_label">Введіть калорійність
                        <input type="text" name="calories" class="modal_inp">
                    </label>
                    <label class="modal_label">Введіть прайс
                        <input type="text" name="price" class="modal_inp">
                    </label>
                     <label class="modal_label">Введіть опис
                        <input type="text" name="description" class="modal_inp">
                    </label>
                     <label class="modal_label">лінк на зображення
                        <input type="text" name="image" class="modal_inp">
                    </label>
                    <button type="submit" class="modal_submit">Відправити</button>
                </form>
            </div>
        </div>
        <ul class="js-list"></ul>
    </div>
    <script type="module" src="./app.js"></script>
</body>
</html>
